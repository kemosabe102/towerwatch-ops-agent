[project]
name = "towerwatch-ops-agent"
version = "0.0.0"
description = "An agent layer over TowerWatch: instrumented MCP server, eval harness, cost-aware router, and semantic tool retrieval."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# Floors, not exact pins — uv.lock holds the resolved versions.
dependencies = [
    "fastmcp>=2.0,<3.0",            # MCP server framework (Phase 1)
    "pydantic>=2.7,<3.0",           # tool schemas with constraints + examples (Phase 1)
    "opentelemetry-api>=1.25,<2.0", # tool code imports the api, not the sdk
    "opentelemetry-sdk>=1.25,<2.0", # one span per tool call, day one (Phase 1)
    "pyyaml>=6.0,<7.0",             # fixture manifest parsing
]

[project.optional-dependencies]
# Evals, benchmarking, and retrieval land in later phases; grouped so the base
# server install stays lean. Populated as each phase is built.
eval = []       # Phase 2 — golden-set + rubric harness
retrieval = []  # Phase 3 — embeddings + vector store (chroma or sqlite-vec)
dev = [
    "ruff",
    "pyright",
    "pytest",
    "pytest-asyncio>=1.4", # the MCP client session tests are async
    "types-pyyaml",       # pyyaml ships no inline types
    "anthropic>=0.34",    # def-token measurement only — never imported by the server
]

[project.scripts]
# Phase 1 entry point — launches the MCP server over stdio. Not yet implemented.
towerwatch-ops-agent = "towerwatch_ops_agent.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/towerwatch_ops_agent"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
